# fly.toml — Fly.io deployment config for the Intercontinental Zoe MCP server.
#
# Deploy (first time):
#   fly launch --no-deploy --copy-config
#   fly secrets set \
#     YOUTUBE_API_KEY=... \
#     HTTP_AUTH_TOKEN=... \
#     RESEND_API_KEY=... \
#     LEAD_EMAIL_TO=you@example.com \
#     LEAD_EMAIL_FROM=zoe@yourdomain.com
#   fly deploy
#
# The MCP Streamable HTTP endpoint lives at https://<app>.fly.dev/mcp.
# The REST mirror (for ChatGPT Custom GPT Actions) lives at /actions/:tool
# and the OpenAPI doc at /openapi.json.

app = "intercontinental-zoe-mcp"
primary_region = "iad"

[build]
  # Uses the Dockerfile in the repo root.

[env]
  NODE_ENV = "production"
  MCP_TRANSPORT = "http"
  PORT = "3000"
  LOG_LEVEL = "info"
  DATA_DIR = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  # MCP sessions can be long-lived (SSE), so keep at least one instance
  # running. Tune for traffic if needed.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
